# .github/workflows/scorecard.yml for techhorizonlabs/thl-open
# Publishes results so the live badge works:
# [![OpenSSF Scorecard](https://api.scorecard.dev/projects/github.com/techhorizonlabs/thl-open/badge)](https://scorecard.dev/viewer/?uri=github.com/techhorizonlabs/thl-open)
name: Scorecard
on:
  branch_protection_rule:
    types: [created, edited, deleted]
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: [ main ]
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: results.sarif
