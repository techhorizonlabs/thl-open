name: Weekly static skill scan
on:
  schedule:
    - cron: '10 2 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**'
      - 'tools/skill-scan/**'
      - '.github/workflows/skill-scan.yml'
permissions:
  contents: read
jobs:
  static-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: target
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cisco-ai-defense/skill-scanner
          ref: 431cb58a5ac333bc0bb9aaa23f7c30ac628f59f8
          path: scanner-source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.14'
      - name: Install pinned static-analysis dependencies (preparation network only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-results/home"
          printf '%s\n' '{"errors":1,"phase":"dependency-preparation","results":[]}' > "$RUNNER_TEMP/skill-results/results.json"
          python -m venv "$RUNNER_TEMP/skill-venv"
          "$RUNNER_TEMP/skill-venv/bin/python" -m pip --isolated --disable-pip-version-check install \
            --require-hashes --only-binary=:all: --index-url https://pypi.org/simple \
            -r target/tools/skill-scan/requirements.txt
      - name: Test scanner wrapper contracts
        run: python -m unittest discover -s target/tools/skill-scan -p 'test_*.py'
      - name: Static analysis without network (fails closed if isolation fails)
        shell: bash
        run: |
          target/tools/skill-scan/run-linux.sh "$GITHUB_WORKSPACE/scanner-source" \
            "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/skill-venv" "$RUNNER_TEMP/skill-results"
      - name: Publish dated job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/skill-results/summary.md" ]]; then
            cat "$RUNNER_TEMP/skill-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$RUNNER_TEMP/skill-results"
            if [[ ! -f "$RUNNER_TEMP/skill-results/results.json" ]]; then
              printf '%s\n' '{"errors":1,"phase":"workflow-preparation","results":[]}' > "$RUNNER_TEMP/skill-results/results.json"
            fi
            echo 'Static scan did not complete. See the failed preparation/isolation step and error artifact; no clean verdict is asserted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: static-skill-scan-results
          path: |
            ${{ runner.temp }}/skill-results/results.json
            ${{ runner.temp }}/skill-results/summary.md
          if-no-files-found: warn
          retention-days: 90
